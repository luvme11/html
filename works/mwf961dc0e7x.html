<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retro MP3 643x203</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 643px;
    height: 203px;
    background: transparent;
    overflow: hidden;
  }
  body {
    font-family: 'VT323', 'Courier New', monospace;
  }

  /* ===================== 643 x 203 ===================== */
  .device {
    position: relative;
    width: 643px;
    height: 203px;
    border-radius: 26px;
    background:
      linear-gradient(180deg, #fafbfd 0%, #dfe3e9 38%, #b4bbc5 50%, #c9cfd7 70%, #eef0f4 100%);
    box-shadow:
      inset 0 0 0 1px #6f7683,
      inset 0 0 0 3px #e9ecf1,
      inset 0 0 0 4px #8a919d,
      inset 0 6px 0 rgba(255,255,255,.55),
      inset 0 -4px 8px rgba(0,0,0,.25);
    overflow: hidden;
  }
  /* 헤어라인 메탈 질감 */
  .device::before {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(90deg, rgba(255,255,255,.22) 0 1px, rgba(0,0,0,.035) 1px 2px, rgba(255,255,255,.08) 2px 3px);
    pointer-events: none;
  }
  /* 상단 광택 */
  .device::after {
    content: '';
    position: absolute; left: 0; right: 0; top: 0; height: 48%;
    background: linear-gradient(180deg, rgba(255,255,255,.65), rgba(255,255,255,.05));
    border-radius: 26px 26px 60% 60% / 26px 26px 14px 14px;
    pointer-events: none;
  }

  /* ----- 스트랩 홀 ----- */
  .strap {
    position: absolute; top: 10px; right: 18px;
    width: 13px; height: 13px; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #20232a, #000);
    box-shadow: 0 0 0 2px #aab1bc, 0 1px 0 2px #fff;
    z-index: 3;
  }

  /* ===================== LCD ===================== */
  .bezel {
    position: absolute; left: 18px; top: 19px;
    width: 336px; height: 165px;
    padding: 8px;
    border-radius: 12px;
    background: linear-gradient(180deg, #3a3e46 0%, #0d0e11 55%, #1b1d22 100%);
    box-shadow:
      0 1px 0 #fff,
      0 0 0 1px #6b727e,
      inset 0 0 0 1px #5a606b,
      inset 0 3px 8px #000;
    z-index: 2;
  }
  .lcd {
    position: relative;
    width: 100%; height: 100%;
    border-radius: 5px;
    overflow: hidden;
    background: linear-gradient(180deg, #8fd0ff 0%, #4a9bf0 100%);
    box-shadow: inset 0 0 14px rgba(0, 40, 120, .65), inset 0 0 0 1px rgba(0,0,0,.6);
  }

  /* 이미지: src만 바꾸면 LCD 전체에 꽉 참 */
  .lcd img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    image-rendering: pixelated;
    filter: saturate(.85) contrast(1.05);
  }
  .lcd img[src=""] { display: none; }

  /* 블루 백라이트 + 도트 격자 */
  .lcd .tint {
    position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background: linear-gradient(180deg, rgba(120,200,255,.35), rgba(20,90,220,.35));
    mix-blend-mode: soft-light;
  }
  .lcd .grid {
    position: absolute; inset: 0; z-index: 3; pointer-events: none;
    background:
      repeating-linear-gradient(0deg, rgba(0,30,90,.16) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, rgba(0,30,90,.12) 0 1px, transparent 1px 3px);
  }
  .lcd .glare {
    position: absolute; inset: 0; z-index: 4; pointer-events: none;
    background: linear-gradient(155deg, rgba(255,255,255,.35) 0%, rgba(255,255,255,0) 40%);
  }

  /* LCD 상태바 */
  .status {
    position: absolute; left: 0; right: 0; top: 0; height: 19px; z-index: 5;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 7px;
    background: rgba(0, 28, 90, .72);
    border-bottom: 1px solid rgba(160, 215, 255, .45);
    color: #d6efff; font-size: 15px; letter-spacing: .06em;
    text-shadow: 0 0 4px rgba(120,200,255,.9);
  }
  .status .l, .status .r { display: flex; align-items: center; gap: 8px; }
  .batt {
    width: 20px; height: 9px; border: 1px solid #d6efff; position: relative; padding: 1px;
    display: flex; gap: 1px;
  }
  .batt::after { content: ''; position: absolute; right: -3px; top: 2px; width: 2px; height: 3px; background: #d6efff; }
  .batt i { flex: 1; background: #d6efff; }

  /* 하단: 스펙트럼 + 진행 */
  .bottom {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 5;
    padding: 0 7px 6px;
    background: linear-gradient(0deg, rgba(0, 24, 80, .85), rgba(0, 24, 80, 0));
    color: #d6efff; text-shadow: 0 0 4px rgba(120,200,255,.9);
  }
  .spec {
    height: 36px; display: flex; align-items: flex-end; gap: 2px;
  }
  .spec i {
    flex: 1; height: 15%;
    background: repeating-linear-gradient(0deg, #e7f6ff 0 2px, transparent 2px 4px);
    box-shadow: 0 0 4px rgba(150, 215, 255, .9);
  }
  .playing .spec i { animation: eq 0.9s steps(8) infinite; }
  @keyframes eq {
    0%, 100% { height: 12%; }
    50% { height: var(--h, 85%); }
  }
  .prog { margin-top: 4px; display: flex; align-items: center; gap: 6px; font-size: 15px; }
  .seg {
    flex: 1; height: 6px; border: 1px solid #d6efff; padding: 1px;
    background: rgba(0, 24, 80, .5);
  }
  .seg b {
    display: block; height: 100%; width: 38%;
    background: repeating-linear-gradient(90deg, #e7f6ff 0 3px, transparent 3px 4px);
  }

  /* ===================== 버튼부 ===================== */
  /* 휠 */
  .wheel {
    position: absolute; left: 388px; top: 37px;
    width: 130px; height: 130px; border-radius: 50%;
    background:
      radial-gradient(circle at 50% 35%, #ffffff 0%, #d9dde4 45%, #aeb5bf 100%);
    box-shadow:
      0 0 0 1px #6f7683,
      0 0 0 4px #e7eaef,
      0 0 0 5px #8a919d,
      0 6px 10px rgba(0,0,0,.35),
      inset 0 2px 3px #fff,
      inset 0 -6px 10px rgba(0,0,0,.2);
    z-index: 2;
  }
  .wheel::before { /* 링 홈 */
    content: ''; position: absolute; inset: 9px; border-radius: 50%;
    border: 1px solid rgba(0,0,0,.18);
    box-shadow: 0 1px 0 rgba(255,255,255,.9), inset 0 1px 0 rgba(255,255,255,.7);
  }
  .arrow { position: absolute; width: 0; height: 0; border: solid transparent; opacity: .75; cursor: pointer; }
  .arrow.up    { left: 55px; top: 14px; border-width: 0 8px 11px 8px; border-bottom-color: #4b525e; }
  .arrow.down  { left: 55px; bottom: 14px; border-width: 11px 8px 0 8px; border-top-color: #4b525e; }
  .arrow.left  { left: 14px; top: 55px; border-width: 8px 11px 8px 0; border-right-color: #4b525e; }
  .arrow.right { right: 14px; top: 55px; border-width: 8px 0 8px 11px; border-left-color: #4b525e; }
  .arrow:hover { opacity: 1; }

  .ok {
    position: absolute; left: 40px; top: 40px;
    width: 50px; height: 50px; border-radius: 50%;
    border: 0; cursor: pointer;
    background:
      radial-gradient(circle at 50% 28%, #ffffff 0%, #cfd5de 40%, #98a0ac 100%);
    box-shadow:
      0 0 0 1px #6f7683,
      0 3px 5px rgba(0,0,0,.4),
      inset 0 2px 2px #fff,
      inset 0 -4px 6px rgba(0,0,0,.2);
    display: grid; place-items: center;
    transition: transform .08s, box-shadow .08s;
  }
  .ok:active { transform: translateY(1px); box-shadow: 0 0 0 1px #6f7683, 0 1px 2px rgba(0,0,0,.4), inset 0 3px 6px rgba(0,0,0,.3); }
  .ok svg { width: 20px; height: 20px; fill: #3d4450; }
  .ok .pause { display: none; }
  .playing .ok .pause { display: block; }
  .playing .ok .go { display: none; }

  /* LED */
  .led {
    position: absolute; left: 447px; top: 20px;
    width: 8px; height: 8px; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #b6d9ff, #2a6fe0 60%, #0b2f80);
    box-shadow: 0 0 6px #3d8bff, 0 0 0 1px #6f7683;
    z-index: 3;
    opacity: .35;
  }
  .playing .led { opacity: 1; }

  /* 우측 작은 버튼들 */
  .pill {
    position: absolute; right: 24px; width: 80px;
    border-radius: 14px;
    background: linear-gradient(180deg, #ffffff 0%, #d3d8e0 50%, #b5bcc7 51%, #d9dde4 100%);
    box-shadow:
      0 0 0 1px #6f7683,
      0 3px 4px rgba(0,0,0,.3),
      inset 0 1px 1px #fff;
    z-index: 2;
    display: grid; place-items: center;
    color: #4b525e; font-size: 15px; letter-spacing: .12em;
    border: 0; cursor: pointer;
  }
  .pill:active { transform: translateY(1px); box-shadow: 0 0 0 1px #6f7683, inset 0 2px 4px rgba(0,0,0,.3); }
  .menu { top: 40px; height: 26px; }

  .rocker { top: 76px; height: 48px; display: grid; grid-template-rows: 1fr 1px 1fr; padding: 0; overflow: hidden; }
  .rocker span { display: grid; place-items: center; font-size: 20px; line-height: 1; cursor: pointer; }
  .rocker span:hover { background: rgba(255,255,255,.5); }
  .rocker hr { border: 0; background: #8f96a2; }

  /* 홀드 스위치 */
  .hold {
    position: absolute; right: 24px; top: 138px; width: 80px; height: 20px;
    border-radius: 10px;
    background: linear-gradient(180deg, #7b828e, #aab1bc);
    box-shadow: inset 0 2px 4px rgba(0,0,0,.5), 0 1px 0 #fff, 0 0 0 1px #6f7683;
    z-index: 2; cursor: pointer;
  }
  .hold i {
    position: absolute; top: 2px; left: 2px; width: 34px; height: 16px; border-radius: 8px;
    background: linear-gradient(180deg, #fff, #c5cbd4);
    box-shadow: 0 1px 2px rgba(0,0,0,.5), 0 0 0 1px #6f7683;
    transition: left .15s;
  }
  .hold.on i { left: 44px; }
  .hold.on { background: linear-gradient(180deg, #c0392b, #ff6a5a); }

  /* 하단 이어폰 / USB 포트 느낌 */
  .port {
    position: absolute; bottom: 0; left: 150px; width: 54px; height: 5px;
    background: #20232a; border-radius: 3px 3px 0 0; z-index: 1;
    box-shadow: 0 -1px 0 #fff;
  }
</style>
</head>

    const spec = document.getElementById('spec');
    for (let i = 0; i < 34; i++) {
      const b = document.createElement('i');
      b.style.setProperty('--h', (30 + Math.random() * 70) + '%');
      b.style.animationDelay = (Math.random() * -0.9) + 's';
      b.style.animationDuration = (0.5 + Math.random() * 0.6) + 's';
      spec.appendChild(b);
    }
    const dev = document.getElementById('dev');
    document.getElementById('ok').addEventListener('click', () => dev.classList.toggle('playing'));
