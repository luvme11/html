<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2004 슬라이드폰</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
:root{--hint:#8a8f98;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:transparent}
body{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.stage{height:100%;display:grid;place-items:center}

/* ---------- 본체 ---------- */
.phone{--w:min(30dvh,86vw,330px);--shell:linear-gradient(160deg,#ffffff 0%,#eef0f3 42%,#d3d7de 100%);
  font-size:calc(var(--w)/17);width:17em;height:47em;position:relative;transform:translateY(-9em);
  transition:transform .7s cubic-bezier(.3,.7,.2,1);cursor:pointer;outline:none;touch-action:none}
.phone.open{transform:none;cursor:default}
.phone:focus-visible{outline:.2em solid #ffd35c;outline-offset:.5em}
.base,.slider{position:absolute;left:0;top:18em;width:17em;height:29em;background:var(--shell);
  box-shadow:inset 0 0 0 .14em #ffffff,inset 0 0 0 .34em #b7bcc5,0 .5em 1.4em rgba(0,0,0,.35)}
.slider{border-radius:8.5em 8.5em 6.5em 6.5em/10em 10em 7em 7em;transition:transform .7s cubic-bezier(.3,.7,.2,1);box-shadow:inset 0 0 0 .14em #ffffff,inset 0 0 0 .34em #b7bcc5,0 .6em 1em rgba(0,0,0,.3)}
.slider::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(125deg,rgba(255,255,255,.55),rgba(255,255,255,0) 38%)}
.open .slider{transform:translateY(-18em)}
.phone.pressing:not(.open) .slider{transform:translateY(-2.5em);transition-duration:.45s}
.base{border-radius:2em 2em 6.5em 6.5em/2em 2em 7em 7em;opacity:0;transition:opacity 0s .7s,clip-path .7s cubic-bezier(.3,.7,.2,1);clip-path:inset(11em 0 -3em 0)}
.open .base,.pressing .base{opacity:1;transition:opacity 0s,clip-path .7s cubic-bezier(.3,.7,.2,1)}
.open .base{clip-path:inset(0 0 -3em 0)}
.side{position:absolute;right:-.3em;top:9em;width:.4em;height:2.6em;border-radius:.2em;background:linear-gradient(#e6e9ee,#b3b9c2)}

/* ---------- 위쪽(화면) ---------- */
.spk{position:absolute;top:1em;left:50%;width:3em;height:.45em;transform:translateX(-50%);border-radius:.3em;background:#7a808a;box-shadow:inset 0 .08em .12em rgba(0,0,0,.6),0 .06em 0 rgba(255,255,255,.7)}
.brand{position:absolute;top:2.2em;left:0;right:0;text-align:center;font:700 .8em/1 Arial,sans-serif;letter-spacing:.04em;color:#7c828c}
.rim{position:absolute;top:3.6em;left:50%;transform:translateX(-50%);padding:.45em;border-radius:1.5em;background:linear-gradient(#ffffff,#c9ced6);box-shadow:inset 0 0 0 .08em #aab0ba,0 .1em 0 rgba(255,255,255,.7)}
.bezel{padding:.4em;border-radius:1.15em;background:linear-gradient(#34373d,#14161a);box-shadow:inset 0 .2em .5em #000}
.lcd{position:relative;width:11.8em;height:14em;border-radius:.8em;overflow:hidden;background:#222;color:#fff}
.logo{position:absolute;top:19.9em;left:0;right:0;text-align:center;font:italic 800 1.25em/1 Arial,sans-serif;letter-spacing:.04em;color:#a3a9b3;text-shadow:0 .06em 0 #ffffff}
.wall{position:absolute;inset:0;transition:filter .2s}
.lcd:not(.m-home):not(.m-wall) .wall{filter:brightness(.5) saturate(.9)}
.grid{position:absolute;inset:0;z-index:6;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,40,.12) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(0,0,40,.09) 0 1px,transparent 1px 3px)}
.glare{position:absolute;inset:0;z-index:7;pointer-events:none;background:linear-gradient(155deg,rgba(255,255,255,.28),rgba(255,255,255,0) 40%)}
.st{position:absolute;left:0;right:0;top:0;height:1.5em;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:0 .6em;background:rgba(0,20,60,.5)}
.sig{display:flex;align-items:flex-end;gap:.15em;height:.85em}
.sig u{width:.26em;background:#fff}.sig u:nth-child(1){height:30%}.sig u:nth-child(2){height:55%}.sig u:nth-child(3){height:80%}.sig u:nth-child(4){height:100%}
.bat{width:1.4em;height:.7em;border:1px solid #fff;padding:1px;position:relative;background:linear-gradient(90deg,#fff 0 75%,transparent 75%) content-box}
.bat::after{content:'';position:absolute;right:-.3em;top:.15em;width:.2em;height:.25em;background:#fff}
.ui{position:absolute;left:0;right:0;top:1.5em;bottom:2em;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;text-shadow:0 .08em .3em rgba(0,0,0,.65)}
.m-home .ui{justify-content:flex-end;padding-bottom:.5em}
.clock{font:700 1em/1 Arial,'Malgun Gothic',sans-serif;letter-spacing:0;white-space:nowrap}
.date{font-size:.95em;margin-top:.4em}
.toast{margin-top:1em;padding:.25em .7em;border-radius:1em;background:rgba(0,0,0,.5);font-size:1em}
.cnt{margin-top:.5em;font:1.3em 'VT323',monospace}
.num{font:700 1.5em/1.2 Arial,'Malgun Gothic',sans-serif;letter-spacing:.02em;word-break:break-all;padding:0 .4em}
.msg{margin-top:.7em;font-size:1.05em}.msg::after{content:'...';animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:.25}}
.ui ul{list-style:none;width:100%;align-self:flex-start;margin-top:.2em}
.ui li{padding:.6em .8em;text-align:left;font-size:1em;border-bottom:1px solid rgba(255,255,255,.18)}
.ui li.on{background:rgba(255,255,255,.9);color:#16345c;text-shadow:none;font-weight:700}
.sk{position:absolute;left:0;right:0;bottom:0;height:2em;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:0 .8em;background:rgba(0,20,60,.55);font-size:.95em}

/* ---------- 메뉴/목록 화면 ---------- */
.ui li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:.45em .8em}
.hd{width:100%;align-self:flex-start;padding:.3em .8em;font-size:.85em;background:rgba(255,255,255,.18);text-align:left}
.gr{display:grid;grid-template-columns:repeat(3,1fr);gap:.35em;width:100%;align-self:stretch;padding:.5em .4em}
.gr div{display:flex;flex-direction:column;align-items:center;gap:.2em;padding:.5em 0;border-radius:.5em;font-size:.8em}
.gr div i{font-style:normal;font-size:1.7em;line-height:1}
.gr div.on{background:rgba(255,255,255,.9);color:#16345c;text-shadow:none;font-weight:700}
.rd{width:100%;align-self:flex-start;text-align:left;padding:.6em .8em;font-size:.95em;line-height:1.5}
.rd small{opacity:.8}.rd p{margin-top:.5em;white-space:normal}
.sk span{color:#fff;opacity:.75}
.sk span.on{color:#ffe14d;opacity:1;font-weight:700}

/* ---------- 방향키 부분 ---------- */
.cluster{position:absolute;left:1.3em;right:1.3em;bottom:1.4em;height:6.6em;display:grid;grid-template-columns:1fr 5.8em 1fr;grid-template-rows:1fr 1fr;align-items:center;justify-items:center}
.s,.cl{--r:0deg;border:0;cursor:pointer;width:2.7em;height:1.5em;border-radius:1em;background:linear-gradient(#ffffff,#d4d8df);transform:rotate(var(--r));
  box-shadow:0 .12em 0 #9aa0aa,0 .24em .3em rgba(0,0,0,.25),inset 0 .08em 0 #fff;display:grid;place-items:center}
.cl svg{width:1.1em;height:1.1em}
.call svg{fill:#2e9a3c}.end svg{fill:#c8352a;transform:rotate(135deg)}
.l{grid-column:1;grid-row:1;--r:-14deg}.r{grid-column:3;grid-row:1;--r:14deg}.call{grid-column:1;grid-row:2;--r:-24deg}.end{grid-column:3;grid-row:2;--r:24deg}
.dp{grid-column:2;grid-row:1/3;position:relative;width:5.8em;height:5.8em;border-radius:50%;background:radial-gradient(circle at 50% 30%,#ffffff,#d6dae1 72%,#bcc1ca);box-shadow:0 0 0 .12em #aab0ba,0 .25em .5em rgba(0,0,0,.3),inset 0 .12em 0 #fff}
.dp button{position:absolute;width:2.9em;height:2.9em;border:0;background:none;cursor:pointer;color:#6a707a;font-size:.65em}
.dp .u{top:.8em;left:3em}.dp .d{bottom:.8em;left:3em}.dp .lf{left:.8em;top:3em}.dp .rt{right:.8em;top:3em}
.dp .ok{left:2.85em;top:2.85em;width:3.2em;height:3.2em;border-radius:50%;background:radial-gradient(circle at 40% 30%,#ffffff,#c4c9d1);box-shadow:0 0 0 .15em #aab0ba,0 .15em 0 .15em #8e949e,inset 0 .15em 0 #fff;font:700 .65em/1 Arial,sans-serif;color:#454a55}
.s:active,.cl:active,.k:active,.dp button:active{filter:brightness(.92)}
.s:focus-visible,.cl:focus-visible,.k:focus-visible,.dp button:focus-visible{outline:.15em solid #1c5fd1;outline-offset:.1em}

/* ---------- 아래쪽(숫자키) ---------- */
.keys{position:absolute;left:1.8em;right:1.8em;top:12.6em;display:grid;grid-template-columns:repeat(3,1fr);gap:.45em}
.k{--r:0deg;height:2.8em;border:0;cursor:pointer;border-radius:1.3em;background:linear-gradient(#ffffff,#eceef2 55%,#d3d7de);transform:rotate(var(--r));
  box-shadow:0 .14em 0 #9aa0aa,inset 0 .08em 0 #fff;color:#5a5d78;display:flex;align-items:center;justify-content:center;gap:.35em}
.k:nth-child(3n+1){--r:-8deg}.k:nth-child(3n){--r:8deg}
.k:nth-child(n+7):nth-child(3n+1){--r:-13deg}.k:nth-child(n+7):nth-child(3n){--r:13deg}
.k:nth-child(n+10):nth-child(3n+1){--r:-19deg}.k:nth-child(n+10):nth-child(3n){--r:19deg}
.k b{font:700 1.3em/1 Arial,sans-serif}.k small{font-size:.65em;color:#8a8f9a}
.mic{position:absolute;bottom:1.1em;left:50%;width:3em;height:.4em;transform:translateX(-50%);background:radial-gradient(circle,#7a808a 0 .1em,transparent .12em) 0 0/.5em .4em}

.hint{display:none;position:fixed;left:0;right:0;bottom:calc(1.2em + env(safe-area-inset-bottom,0px));text-align:center;color:var(--hint);font-size:13px}
@media (prefers-reduced-motion:reduce){.phone,.slider{transition:none}.msg::after{animation:none}}
</style>
</head>
<body>
<main class="stage">
  <div class="phone" id="phone" tabindex="0" role="button" aria-label="슬라이드폰 열기">
    <div class="base" id="base">
      <div class="keys" id="keys"></div>
      <div class="mic"></div>
    </div>
    <div class="slider" id="slider">
      <i class="side"></i>
      <div class="spk"></div>
      <div class="rim"><div class="bezel">
        <div class="lcd" id="lcd">
          <div class="wall" id="wall"></div>
          <div class="st"><div class="sig"><u></u><u></u><u></u><u></u></div><div class="bat"></div></div>
          <div class="ui" id="ui"></div>
          <div class="sk" id="sk"></div>
          <div class="grid"></div><div class="glare"></div>
        </div>
      </div></div>
      <div class="logo">RETRO</div>
      <div class="cluster" id="cluster">
        <button class="s l" data-k="L" aria-label="왼쪽 소프트키"></button>
        <button class="s r" data-k="R" aria-label="오른쪽 소프트키"></button>
        <div class="dp">
          <button class="u" data-k="U" aria-label="위">&#9650;</button>
          <button class="d" data-k="D" aria-label="아래">&#9660;</button>
          <button class="lf" data-k="LF" aria-label="왼쪽">&#9664;</button>
          <button class="rt" data-k="RT" aria-label="오른쪽">&#9654;</button>
          <button class="ok" data-k="OK" aria-label="확인">OK</button>
        </div>
        <button class="cl call" data-k="CALL" aria-label="통화"><svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg></button>
        <button class="cl end" data-k="END" aria-label="종료"><svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg></button>
      </div>
    </div>
  </div>
</main>
<p class="hint" id="hint"></p>
<input type="file" id="file" accept="image/*" hidden>

{n:'밤하늘',c:'radial-gradient(circle at 76% 22%,#fff6c4 0 5%,transparent 5.5%),radial-gradient(.12em .12em at 18% 30%,#fff,transparent),radial-gradient(.12em .12em at 64% 14%,#fff,transparent),radial-gradient(.15em .15em at 40% 66%,#cfe8ff,transparent),radial-gradient(.12em .12em at 86% 58%,#fff,transparent),radial-gradient(.12em .12em at 28% 84%,#fff,transparent),linear-gradient(#050b2e,#213b80)'},
{n:'핑크 도트',c:'radial-gradient(circle,#fff 0 22%,transparent 24%) 0 0/1.4em 1.4em,radial-gradient(circle,#ffd6ea 0 22%,transparent 24%) .7em .7em/1.4em 1.4em,#ff82bb'},
{n:'클로버',c:'repeating-conic-gradient(#86df5c 0 25%,#62c348 0 50%) 0 0/2em 2em'},
{n:'민트 줄무늬',c:'repeating-linear-gradient(135deg,#c6f5e8 0 .9em,#8fe3cd .9em 1.8em)'}
];
const CUSTOM=WP.length;
const KP=[['1','ㅣ'],['2','·'],['3','ㅡ'],['4','ㄱㅋ'],['5','ㄴㄹ'],['6','ㄷㅌ'],['7','ㅂㅍ'],['8','ㅅㅎ'],['9','ㅈㅊ'],['*',''],['0','ㅇㅁ'],['#','']];
$('keys').innerHTML=KP.map(([d,l])=>`<button class="k" data-k="${d}"><b>${d}</b><small>${l}</small></button>`).join('');

let open=false,mode='home',sel=0,wp=0,prev=0,num='',toast='',tt;
let bk='home',hsel=0,alarmOn=false;
/* 전화부: ['이름','번호'] — 번호는 여기서 바꾸면 돼요 */
const CT=[['임찬희♡','010-0000-0000'],['서미르','010-0000-0000'],['표유리','010-0000-0000'],['류보민','010-0000-0000'],['비우주','010-0000-0000'],['차범','010-0000-0000']];
const MS=[['엄마','오늘 몇 시에 와? 저녁 먹자','23:10'],['민지','내일 학교에서 봐ㅋㅋ','21:42'],['통신사','[Web발신] 이번 달 요금이 청구되었습니다.','11.01'],['아빠','차 조심해서 와라','11.12']];
const MN=[['📖','전화부'],['✉️','문자'],['⏰','알람'],['🖼️','배경화면'],['📷','내 사진'],['✕','닫기']];
function lst(title,items,s){const n=4,st=Math.min(Math.max(s-1,0),Math.max(items.length-n,0));return `<div class="hd">${title}</div><ul>`+items.slice(st,st+n).map((x,i)=>`<li class="${st+i===s?'on':''}">${x}</li>`).join('')+'</ul>'}
function go(m){bk=mode;mode=m;sel=0}
const p2=n=>String(n).padStart(2,'0');

function render(){
  const t=new Date(),hm=p2(t.getHours())+':'+p2(t.getMinutes());
  wall.style.background=WP[wp].c;
  lcd.className='lcd m-'+mode;
  const S={home:['메뉴','전화부'],book:['선택','뒤로'],contact:['통화','뒤로'],msgs:['읽기','뒤로'],read:['','뒤로'],alarm:[alarmOn?'해제':'설정','뒤로'],dial:['통화','지움'],call:['','종료'],menu:['선택','뒤로'],wall:['확인','취소']}[mode];
  let h='';
  if(mode==='home')h=(toast?`<div class="toast" style="margin:0 0 .6em">◀ ${toast} ▶</div>`:'')+`<div class="clock">${t.getMonth()+1}.${p2(t.getDate())}(${'일월화수목금토'[t.getDay()]}) ${t.getHours()%12||12}:${p2(t.getMinutes())}${t.getHours()<12?'AM':'PM'}</div>`;
  else if(mode==='dial'||mode==='call')h=`<div class="num">${num}</div>`+(mode==='call'?'<div class="msg">통화 중</div>':'');
  else if(mode==='book')h=lst('전화부',CT.map(c=>c[0]),sel);
  else if(mode==='contact')h=`<div class="toast">${CT[sel][0]}</div><div class="num">${CT[sel][1]}</div><div class="date">통화하려면 OK</div>`;
  else if(mode==='msgs')h=lst('받은 문자함',MS.map(m=>m[0]+' · '+m[1]),sel);
  else if(mode==='read')h=`<div class="rd"><b>${MS[sel][0]}</b> <small>${MS[sel][2]}</small><p>${MS[sel][1]}</p></div>`;
  else if(mode==='alarm')h=`<div class="toast">알람</div><div class="num">AM 6:30</div><div class="date">${alarmOn?'🔔 켜짐':'🔕 꺼짐'}</div>`;
  else if(mode==='menu')h='<div class="gr">'+MN.map((x,i)=>`<div class="${i===sel?'on':''}"><i>${x[0]}</i>${x[1]}</div>`).join('')+'</div>';
  else h=`<div class="toast">◀ ${WP[wp].n} ▶</div><div class="cnt">${wp+1} / ${WP.length}</div>`;
  ui.innerHTML=h;
  const on=i=>mode==='home'&&hsel===i?' class="on"':'';
  sk.innerHTML=`<span${on(0)}>${S[0]}</span><span${on(1)}>${S[1]}</span>`;
}
function setOpen(o){
  open=!!o;
  phone.classList.toggle('open',open);phone.classList.remove('pressing');cluster.inert=!open;
  base.inert=!open;
  phone.setAttribute('role',open?'group':'button');
  phone.setAttribute('aria-label',open?'슬라이드폰':'슬라이드폰 열기');
  hint.textContent=open?'숫자·방향키로 조작 · 빨간 종료키를 누르거나 아래로 밀면 닫혀요':HINT;
  if(!open){mode='home';num='';hsel=0}
  render();
}
function step(d){wp=(wp+d+WP.length)%WP.length}
function cyc(d){step(d);toast=WP[wp].n;clearTimeout(tt);tt=setTimeout(()=>{toast='';render()},1300)}

function press(k){
  if(!open){setOpen(true);return}
  const dg=/^[0-9*#]$/.test(k);
  const mv=(n,d)=>{sel=(sel+d+n)%n};
  if(k==='END'){
    if(mode==='home'){setOpen(false);return}
    if(mode==='wall')wp=prev;
    mode='home';num='';
  }else if(mode==='home'){
    if(dg){mode='dial';num=k}
    else if(k==='LF')hsel=0;
    else if(k==='RT')hsel=1;
    else if(k==='R')go('book');
    else if(k==='OK'&&hsel===1)go('book');
  }else if(mode==='menu'){
    if(k==='LF')mv(6,-1);
    else if(k==='RT')mv(6,1);
    else if(k==='U'||k==='D')mv(6,3);
    else if(k==='R')mode='home';
    else if(k==='L'||k==='OK'){
      if(sel===0)go('book');
      else if(sel===1)go('msgs');
      else if(sel===2)go('alarm');
      else if(sel===3){prev=wp;go('wall')}
      else if(sel===4){prev=wp;file.click()}
      else{setOpen(false);return}
    }
  }else if(mode==='book'){
    if(k==='U')mv(CT.length,-1);
    else if(k==='D')mv(CT.length,1);
    else if(k==='R')mode=bk;
    else if(k==='L'||k==='OK'){bk='book';mode='contact'}
    else if(k==='CALL'){num=CT[sel][1];mode='call'}
  }else if(mode==='contact'){
    if(k==='R')mode='book';
    else if(k==='L'||k==='OK'||k==='CALL'){num=CT[sel][1];mode='call'}
  }else if(mode==='msgs'){
    if(k==='U')mv(MS.length,-1);
    else if(k==='D')mv(MS.length,1);
    else if(k==='R')mode=bk;
    else if(k==='L'||k==='OK')mode='read';
  }else if(mode==='read'){
    if(k==='R'||k==='L'||k==='OK')mode='msgs';
  }else if(mode==='alarm'){
    if(k==='L'||k==='OK')alarmOn=!alarmOn;
    else if(k==='R')mode=bk;
  }else if(mode==='dial'){
    if(dg){if(num.length<13)num+=k}
    else if(k==='R'){num=num.slice(0,-1);if(!num)mode='home'}
    else if(k==='L'||k==='CALL'||k==='OK')mode='call';
  }else if(mode==='wall'){
    if(k==='LF'||k==='U')step(-1);
    else if(k==='RT'||k==='D')step(1);
    else if(k==='L'||k==='OK')mode='home';
    else if(k==='R'){wp=prev;mode=bk}
  }
  render();
}


let hold,held=false,drag=false,sy=0,grab=false;
phone.addEventListener('pointerdown',e=>{
  if(e.button>0)return;
  held=false;drag=true;sy=e.clientY;
  grab=!!e.target.closest('#slider')&&!e.target.closest('button');
});
phone.addEventListener('pointermove',e=>{
  if(!drag)return;
  const dy=e.clientY-sy;
  if(!open&&dy<-28){held=true;drag=false;clearTimeout(hold);setOpen(true)}
  else if(open&&grab&&dy>40){held=true;drag=false;setOpen(false)}
});
['pointerup','pointerleave','pointercancel'].forEach(ev=>phone.addEventListener(ev,()=>{
  clearTimeout(hold);drag=false;if(!open)phone.classList.remove('pressing');
}));
['pointerup','pointercancel','blur'].forEach(ev=>addEventListener(ev,()=>{clearTimeout(hold);drag=false;if(!open)phone.classList.remove('pressing')}));
phone.addEventListener('contextmenu',e=>e.preventDefault());
phone.addEventListener('click',e=>{
  if(held){held=false;return}
  if(!open){setOpen(true);return}
  const b=e.target.closest('[data-k]');
  if(b)press(b.dataset.k);
});
file.addEventListener('change',()=>{
  const f=file.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{WP[CUSTOM]={n:'내 사진',c:`url(${r.result}) center/cover`};wp=CUSTOM;bk='menu';mode='wall';render()};
  r.readAsDataURL(f);file.value='';
});
addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&document.activeElement.tagName==='BUTTON')return;
  const m={ArrowUp:'U',ArrowDown:'D',ArrowLeft:'LF',ArrowRight:'RT',Enter:'OK',' ':'OK',Backspace:'R',Escape:'END'};
  const k=m[e.key]||(/^[0-9*#]$/.test(e.key)?e.key:null);
  if(!k)return;
  e.preventDefault();press(k);
});
setOpen(false);
setInterval(render,5000);
</script>
</body>
</html>
